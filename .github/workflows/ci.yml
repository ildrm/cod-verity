name: Plugin verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: codverity-ci-only
          MARIADB_DATABASE: codverity
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CODVERITY_DB_HOST: 127.0.0.1:3306
      CODVERITY_DB_PASS: codverity-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, dom, curl, zip
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: php tools/fetch-stubs.php
      - run: composer lint && composer cs && composer analyse
      - run: vendor/bin/phpunit --testsuite unit
      - run: bash tools/setup-test-site.sh
      - name: Legacy order integration
        run: CODVERITY_WP_ROOT="$PWD/build/wordpress" CODVERITY_STORAGE=legacy vendor/bin/phpunit --testsuite integration
      - name: Enable HPOS using supported migration controls
        run: |
          php build/wp-cli.phar --allow-root --path=build/wordpress wc hpos sync
          php build/wp-cli.phar --allow-root --path=build/wordpress option update woocommerce_custom_orders_table_enabled yes
      - name: HPOS order integration
        run: CODVERITY_WP_ROOT="$PWD/build/wordpress" CODVERITY_STORAGE=hpos vendor/bin/phpunit --testsuite integration
      - name: HTTP and competing decisions
        run: |
          php -S 127.0.0.1:8097 -t build/wordpress >build/http-server.log 2>&1 &
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:8097/wp-login.php >/dev/null && break || sleep 1; done
          export CODVERITY_WP_ROOT="$PWD/build/wordpress"
          php tests/http.php
          php tests/checkout-http.php
          php tests/concurrency.php
      - run: php tools/package.php
      - uses: actions/upload-artifact@v4
        with:
          name: codverity-php-${{ matrix.php }}
          path: dist/*
